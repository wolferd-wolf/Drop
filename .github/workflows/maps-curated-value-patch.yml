name: Maps curated value patch

on:
  push:
    branches:
      - automation/calendar-normal-flow-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/calendar-normal-flow-verification
          fetch-depth: 0
      - name: Route edited address into Maps and add verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/wolferdwolf/drop/MainActivity.kt')
          text = main.read_text()
          old = '''            SuggestedActionType.MAPS -> startActivity(
                Intent(this, MapConfirmationActivity::class.java)
                    .putExtra(MapConfirmationActivity.EXTRA_SOURCE_TEXT, text)
            )'''
          new = '''            SuggestedActionType.MAPS -> startActivity(
                Intent(this, MapConfirmationActivity::class.java)
                    .putExtra(MapConfirmationActivity.EXTRA_SOURCE_TEXT, text)
                    .putExtra(MapConfirmationActivity.EXTRA_CURATED_QUERY, first(results, ExtractionType.ADDRESS).orEmpty())
            )'''
          if old not in text:
              raise SystemExit('MainActivity Maps launch block not found')
          main.write_text(text.replace(old, new, 1))

          maps = Path('app/src/main/java/com/wolferdwolf/drop/maps/MapConfirmationActivity.kt')
          text = maps.read_text()
          old = '''        val source = intent.getStringExtra(EXTRA_SOURCE_TEXT).orEmpty()
        val suggestion = AddressCandidateDetector.detect(source)?.value ?: source.take(MAX_QUERY_LENGTH)
'''
          new = '''        val source = intent.getStringExtra(EXTRA_SOURCE_TEXT).orEmpty()
        val curatedQuery = intent.getStringExtra(EXTRA_CURATED_QUERY).orEmpty()
        val suggestion = initialQuery(source, curatedQuery)
'''
          if old not in text:
              raise SystemExit('MapConfirmationActivity initial suggestion block not found')
          text = text.replace(old, new, 1)
          old = '''        const val EXTRA_SOURCE_TEXT = "source_text"
        const val MAX_QUERY_LENGTH = 500

        internal fun historyTitle(query: String): String =
'''
          new = '''        const val EXTRA_SOURCE_TEXT = "source_text"
        const val EXTRA_CURATED_QUERY = "curated_query"
        const val MAX_QUERY_LENGTH = 500

        internal fun initialQuery(source: String, curatedQuery: String): String =
            curatedQuery.trim().takeIf(String::isNotBlank)?.take(MAX_QUERY_LENGTH)
                ?: AddressCandidateDetector.detect(source)?.value
                ?: source.take(MAX_QUERY_LENGTH)

        internal fun historyTitle(query: String): String =
'''
          if old not in text:
              raise SystemExit('MapConfirmationActivity companion block not found')
          maps.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/android-ci.yml')
          text = workflow.read_text()
          marker = 'drop-year-first-dotted-date-actions'
          replacement = marker + ' drop-maps-curated-value'
          count = text.count(marker)
          if count < 2:
              raise SystemExit(f'Expected Maps screenshot list marker twice, found {count}')
          workflow.write_text(text.replace(marker, replacement))
          PY

          mkdir -p app/src/test/java/com/wolferdwolf/drop/maps
          cat > app/src/test/java/com/wolferdwolf/drop/maps/MapConfirmationActivityTest.kt <<'EOF'
          package com.wolferdwolf.drop.maps

          import org.junit.Assert.assertEquals
          import org.junit.Test

          class MapConfirmationActivityTest {
              @Test
              fun curatedAddressOverridesOriginalSourceExtraction() {
                  assertEquals(
                      "Edited venue, Vijayawada",
                      MapConfirmationActivity.initialQuery(
                          source = "Meeting at MG Road, Vijayawada",
                          curatedQuery = "  Edited venue, Vijayawada  "
                      )
                  )
              }

              @Test
              fun blankCuratedAddressFallsBackToDetectedSourceAddress() {
                  assertEquals(
                      "MG Road, Vijayawada",
                      MapConfirmationActivity.initialQuery(
                          source = "Venue: MG Road, Vijayawada",
                          curatedQuery = "   "
                      )
                  )
              }
          }
          EOF

          cat > app/src/androidTest/java/com/wolferdwolf/drop/MapsCuratedValueFlowTest.kt <<'EOF'
          package com.wolferdwolf.drop

          import androidx.test.core.app.ActivityScenario
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import androidx.test.platform.app.InstrumentationRegistry
          import androidx.test.uiautomator.By
          import androidx.test.uiautomator.UiDevice
          import androidx.test.uiautomator.UiObject2
          import androidx.test.uiautomator.Until
          import org.junit.Assert.assertNotNull
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class MapsCuratedValueFlowTest {
              @Test
              fun editedAddressReachesMapsConfirmationFromNormalIntakeFlow() {
                  ActivityScenario.launch(MainActivity::class.java).use {
                      val device = UiDevice.getInstance(InstrumentationRegistry.getInstrumentation())
                      clickText(device, "Paste text")
                      val input = objectFor(device, By.clazz("android.widget.EditText"), "Paste text input is missing")
                      input.text = "Product launch meeting at MG Road, Vijayawada."
                      dismissKeyboard(device)
                      clickText(device, "Continue")
                      clickText(device, "Extract details")
                      visible(device, "Extracted information")

                      val address = objectFor(
                          device,
                          By.clazz("android.widget.EditText").text("MG Road, Vijayawada"),
                          "Detected address must be editable"
                      )
                      address.click()
                      address.text = "Edited venue, Vijayawada"
                      dismissKeyboard(device)
                      objectFor(
                          device,
                          By.clazz("android.widget.EditText").text("Edited venue, Vijayawada"),
                          "Edited address was not committed"
                      )

                      clickText(device, "See suggested actions", scroll = true)
                      visible(device, "Suggested actions")
                      clickText(device, "Open in Maps", scroll = true)
                      visible(device, "Confirm the location")
                      objectFor(
                          device,
                          By.clazz("android.widget.EditText").text("Edited venue, Vijayawada"),
                          "Maps confirmation discarded the curated address"
                      )
                      capture(device, "/data/local/tmp/drop-maps-curated-value.png")
                  }
              }

              private fun clickText(device: UiDevice, text: String, scroll: Boolean = false) {
                  val node = if (scroll) visibleAfterScroll(device, text) else visible(device, text)
                  val target = clickableAncestor(node) ?: node
                  val bounds = target.visibleBounds
                  assertTrue("Target has no tappable area", !bounds.isEmpty)
                  assertTrue("Coordinate tap failed", device.click(bounds.centerX(), bounds.centerY()))
                  device.waitForIdle()
              }

              private fun clickableAncestor(node: UiObject2): UiObject2? {
                  var current: UiObject2? = node
                  while (current != null) {
                      if (current.isClickable) return current
                      current = current.parent
                  }
                  return null
              }

              private fun dismissKeyboard(device: UiDevice) {
                  device.executeShellCommand("input keyevent KEYCODE_ESCAPE")
                  device.waitForIdle()
              }

              private fun capture(device: UiDevice, path: String) {
                  device.waitForIdle()
                  device.executeShellCommand("rm -f $path")
                  device.executeShellCommand("screencap -p $path")
                  assertTrue(device.executeShellCommand("ls -l $path").contains(path.substringAfterLast('/')))
              }

              private fun visible(device: UiDevice, text: String): UiObject2 =
                  assertNotNull("Expected visible text: $text", device.wait(Until.findObject(By.text(text)), TIMEOUT))
                      .let { device.findObject(By.text(text)) }

              private fun visibleAfterScroll(device: UiDevice, text: String): UiObject2 {
                  device.wait(Until.findObject(By.text(text)), SHORT_TIMEOUT)?.let { return it }
                  repeat(9) {
                      device.swipe(
                          device.displayWidth / 2,
                          device.displayHeight * 3 / 4,
                          device.displayWidth / 2,
                          device.displayHeight / 4,
                          20
                      )
                      device.waitForIdle()
                      device.wait(Until.findObject(By.text(text)), SHORT_TIMEOUT)?.let { return it }
                  }
                  throw AssertionError("Expected visible text after scrolling: $text")
              }

              private fun objectFor(device: UiDevice, selector: androidx.test.uiautomator.BySelector, message: String): UiObject2 =
                  assertNotNull(message, device.wait(Until.findObject(selector), TIMEOUT)).let { device.findObject(selector) }

              private companion object {
                  const val TIMEOUT = 20_000L
                  const val SHORT_TIMEOUT = 2_000L
              }
          }
          EOF

          git rm .github/workflows/maps-curated-value-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app .github/workflows/android-ci.yml
          git commit -m "Preserve edited address in Maps confirmation"
          git push origin HEAD:automation/calendar-normal-flow-verification

# Manual retrigger for the prepared integration patch.
