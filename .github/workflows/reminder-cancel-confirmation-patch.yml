name: Reminder cancellation product patch

on:
  push:
    branches:
      - automation/calendar-normal-flow-verification
    paths:
      - .github/workflows/reminder-cancel-confirmation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/calendar-normal-flow-verification
          fetch-depth: 0
      - name: Add explicit reminder cancellation confirmation and verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/wolferdwolf/drop/MainActivity.kt')
          text = main.read_text()

          old = '''                        { reminder -> reminderScheduler.cancel(reminder).onSuccess { reminderStore.delete(reminder.id); refreshHistory() } }\n'''
          new = '''                        { reminder ->\n                            runCatching {\n                                reminderScheduler.cancel(reminder).getOrThrow()\n                                reminderStore.delete(reminder.id)\n                                refreshHistory()\n                            }.isSuccess\n                        }\n'''
          if old not in text:
              raise SystemExit('History reminder cancellation callback pattern not found')
          text = text.replace(old, new, 1)

          old = '''    onDeleteReference: (SavedReference) -> Unit,\n    onCancelReminder: (ReminderRecord) -> Unit\n) {\n    var pendingDeleteId by rememberSaveable { mutableStateOf<Long?>(null) }\n'''
          new = '''    onDeleteReference: (SavedReference) -> Unit,\n    onCancelReminder: (ReminderRecord) -> Boolean\n) {\n    var pendingDeleteId by rememberSaveable { mutableStateOf<Long?>(null) }\n    var pendingCancelReminderId by rememberSaveable { mutableStateOf<String?>(null) }\n    var reminderCancelStatus by rememberSaveable { mutableStateOf<String?>(null) }\n    var reminderCancelFailed by rememberSaveable { mutableStateOf(false) }\n'''
          if old not in text:
              raise SystemExit('HistoryScreen signature/state pattern not found')
          text = text.replace(old, new, 1)

          anchor = '''    references.firstOrNull { it.id == pendingDeleteId }?.let { reference ->\n        AlertDialog(\n            onDismissRequest = { pendingDeleteId = null },\n            title = { Text("Delete saved reference?") },\n            text = { Text("“${reference.title}” will be removed from History on this device. This cannot be undone.") },\n            confirmButton = {\n                TextButton(onClick = {\n                    onDeleteReference(reference)\n                    pendingDeleteId = null\n                }) { Text("Delete") }\n            },\n            dismissButton = {\n                OutlinedButton(onClick = { pendingDeleteId = null }) { Text("Keep reference") }\n            }\n        )\n    }\n\n'''
          addition = anchor + '''    reminders.firstOrNull { it.id == pendingCancelReminderId }?.let { reminder ->\n        AlertDialog(\n            onDismissRequest = { pendingCancelReminderId = null },\n            title = { Text("Cancel reminder?") },\n            text = {\n                Text(\n                    "“${reminder.title}” will stop notifying you and be removed from History on this device. This cannot be undone."\n                )\n            },\n            confirmButton = {\n                TextButton(onClick = {\n                    val cancelled = onCancelReminder(reminder)\n                    reminderCancelFailed = !cancelled\n                    reminderCancelStatus = if (cancelled) {\n                        "Reminder cancelled. Its notification was stopped and it was removed from History."\n                    } else {\n                        "Reminder could not be cancelled. It remains in History."\n                    }\n                    pendingCancelReminderId = null\n                }) { Text("Yes, cancel reminder") }\n            },\n            dismissButton = {\n                OutlinedButton(onClick = { pendingCancelReminderId = null }) { Text("Keep reminder") }\n            }\n        )\n    }\n\n'''
          if anchor not in text:
              raise SystemExit('Reference delete dialog anchor not found')
          text = text.replace(anchor, addition, 1)

          old = '''            item { Text("Saved actions", style = MaterialTheme.typography.headlineSmall) }\n            item {\n                OutlinedTextField(\n'''
          new = '''            item { Text("Saved actions", style = MaterialTheme.typography.headlineSmall) }\n            reminderCancelStatus?.let { status ->\n                item {\n                    Text(\n                        status,\n                        color = if (reminderCancelFailed) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.primary\n                    )\n                }\n            }\n            item {\n                OutlinedTextField(\n'''
          if old not in text:
              raise SystemExit('History status insertion anchor not found')
          text = text.replace(old, new, 1)

          old = '''                        TextButton(onClick = { onCancelReminder(reminder) }) { Text("Cancel reminder") }\n'''
          new = '''                        TextButton(onClick = {\n                            reminderCancelStatus = null\n                            reminderCancelFailed = false\n                            pendingCancelReminderId = reminder.id\n                        }) { Text("Cancel reminder") }\n'''
          if old not in text:
              raise SystemExit('Reminder cancel button pattern not found')
          text = text.replace(old, new, 1)
          main.write_text(text)

          test = Path('app/src/androidTest/java/com/wolferdwolf/drop/HistoryReminderCancellationFlowTest.kt')
          test.write_text(r'''package com.wolferdwolf.drop

import androidx.test.core.app.ActivityScenario
import androidx.test.ext.junit.runners.AndroidJUnit4
import androidx.test.platform.app.InstrumentationRegistry
import androidx.test.uiautomator.By
import androidx.test.uiautomator.UiDevice
import androidx.test.uiautomator.UiObject2
import androidx.test.uiautomator.UiScrollable
import androidx.test.uiautomator.UiSelector
import androidx.test.uiautomator.Until
import com.wolferdwolf.drop.reminder.ReminderHistoryStore
import com.wolferdwolf.drop.reminder.ReminderValidator
import org.junit.Assert.assertFalse
import org.junit.Assert.assertTrue
import org.junit.Test
import org.junit.runner.RunWith

@RunWith(AndroidJUnit4::class)
class HistoryReminderCancellationFlowTest {
    @Test
    fun reminderCancellationRequiresConfirmationAndReportsSuccess() {
        val instrumentation = InstrumentationRegistry.getInstrumentation()
        val store = ReminderHistoryStore(instrumentation.targetContext)
        val title = "Confirm cancellation supply check"
        store.load().filter { it.title == title }.forEach { store.delete(it.id) }
        val record = store.save(
            ReminderValidator.ValidReminder(
                title = title,
                notes = "Cancellation must be deliberate",
                triggerAtMillis = System.currentTimeMillis() + 24 * 60 * 60 * 1000L
            )
        )

        try {
            ActivityScenario.launch(MainActivity::class.java).use {
                val device = UiDevice.getInstance(instrumentation)
                tapTextPrefix(device, "History")
                val search = requireVisible(device, By.clazz("android.widget.EditText"), "History search field is missing")
                search.text = title
                device.executeShellCommand("input keyevent KEYCODE_ESCAPE")
                visibleAfterScroll(device, title)
                tapTextAfterScroll(device, "Cancel reminder")

                requireVisible(device, By.text("Cancel reminder?"), "Cancellation confirmation is missing")
                requireVisible(device, By.textContains(title), "Confirmation must identify the reminder")
                requireVisible(device, By.text("Keep reminder"), "Keep reminder action is missing")
                requireVisible(device, By.text("Yes, cancel reminder"), "Explicit cancellation action is missing")
                capture(device, "/data/local/tmp/drop-history-reminder-cancel-confirmation.png")

                tapText(device, "Keep reminder")
                assertTrue("Dismissing cancellation must preserve the reminder", store.load().any { it.id == record.id })
                tapTextAfterScroll(device, "Cancel reminder")
                requireVisible(device, By.text("Cancel reminder?"), "Cancellation confirmation did not reopen")
                tapText(device, "Yes, cancel reminder")

                visibleAfterScroll(device, "Reminder cancelled. Its notification was stopped and it was removed from History.")
                assertFalse("Confirmed cancellation must remove the reminder from History", store.load().any { it.id == record.id })
                capture(device, "/data/local/tmp/drop-history-reminder-cancelled.png")
            }
        } finally {
            store.load().filter { it.id == record.id }.forEach { store.delete(it.id) }
        }
    }

    private fun tapTextPrefix(device: UiDevice, prefix: String) {
        val node = requireVisible(device, By.textStartsWith(prefix), "Expected control beginning with $prefix")
        tap(node, device)
    }

    private fun tapText(device: UiDevice, text: String) {
        tap(requireVisible(device, By.text(text), "Expected control: $text"), device)
    }

    private fun tapTextAfterScroll(device: UiDevice, text: String) {
        repeat(12) { attempt ->
            device.findObjects(By.text(text)).firstOrNull { !it.visibleBounds.isEmpty }?.let {
                tap(it, device)
                return
            }
            if (attempt < 11) scrollForward(device)
        }
        throw AssertionError("Expected tappable text after scrolling: $text")
    }

    private fun visibleAfterScroll(device: UiDevice, text: String) {
        repeat(12) { attempt ->
            if (device.wait(Until.hasObject(By.text(text)), 750L)) return
            if (attempt < 11) scrollForward(device)
        }
        throw AssertionError("Expected visible text after scrolling: $text")
    }

    private fun requireVisible(device: UiDevice, selector: androidx.test.uiautomator.BySelector, message: String): UiObject2 {
        assertTrue(message, device.wait(Until.hasObject(selector), TIMEOUT))
        return device.findObject(selector) ?: throw AssertionError(message)
    }

    private fun tap(node: UiObject2, device: UiDevice) {
        var target: UiObject2? = node
        while (target != null && !target.isClickable) target = target.parent
        val bounds = (target ?: node).visibleBounds
        assertTrue("Target has no tappable area", !bounds.isEmpty)
        assertTrue("Tap failed", device.click(bounds.centerX(), bounds.centerY()))
        device.waitForIdle()
    }

    private fun scrollForward(device: UiDevice) {
        val list = UiScrollable(UiSelector().scrollable(true))
        if (list.exists()) {
            list.setAsVerticalList()
            list.scrollForward()
        } else {
            device.swipe(device.displayWidth / 2, device.displayHeight * 3 / 4, device.displayWidth / 2, device.displayHeight / 4, 18)
        }
        device.waitForIdle()
    }

    private fun capture(device: UiDevice, path: String) {
        device.waitForIdle()
        device.executeShellCommand("rm -f $path")
        device.executeShellCommand("screencap -p $path")
        assertTrue(device.executeShellCommand("ls -l $path").contains(path.substringAfterLast('/')))
    }

    private companion object {
        const val TIMEOUT = 20_000L
    }
}
''')

          script = Path('.github/scripts/run-screenshot-tests.sh')
          s = script.read_text()
          marker = '  drop-history-reminder-status\n'
          replacement = marker + '  drop-history-reminder-cancel-confirmation\n  drop-history-reminder-cancelled\n'
          if marker not in s:
              raise SystemExit('Screenshot list marker not found')
          script.write_text(s.replace(marker, replacement, 1))
          PY

          git rm .github/workflows/reminder-cancel-confirmation-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wolferdwolf/drop/MainActivity.kt \
                  app/src/androidTest/java/com/wolferdwolf/drop/HistoryReminderCancellationFlowTest.kt \
                  .github/scripts/run-screenshot-tests.sh
          git commit -m 'Require confirmation before cancelling reminders'
          git push origin HEAD:automation/calendar-normal-flow-verification
