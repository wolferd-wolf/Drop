name: Make saved History cards directly actionable

on:
  push:
    branches:
      - automation/calendar-normal-flow-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/calendar-normal-flow-verification
      - name: Make reference card open details and use it in restart verification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/wolferdwolf/drop/MainActivity.kt')
          s = main.read_text()
          old = '''            items(filteredReferences, key = SavedReference::id) { reference ->\n                Card(Modifier.fillMaxWidth()) {\n                    Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {\n                        Text(reference.title, style = MaterialTheme.typography.titleMedium)\n                        Text("Source: ${reference.sourceType.label}", style = MaterialTheme.typography.labelLarge)\n                        Text(reference.originalText, maxLines = 3)\n                        FilledTonalButton(onClick = { onViewReference(reference) }, modifier = Modifier.fillMaxWidth()) { Text("View details") }\n                        TextButton(onClick = { pendingDeleteId = reference.id }) { Text("Delete") }\n                    }\n                }\n            }'''
          new = '''            items(filteredReferences, key = SavedReference::id) { reference ->\n                Card(onClick = { onViewReference(reference) }, modifier = Modifier.fillMaxWidth()) {\n                    Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {\n                        Text(reference.title, style = MaterialTheme.typography.titleMedium)\n                        Text("Source: ${reference.sourceType.label}", style = MaterialTheme.typography.labelLarge)\n                        Text(reference.originalText, maxLines = 3)\n                        FilledTonalButton(onClick = { onViewReference(reference) }, modifier = Modifier.fillMaxWidth()) { Text("View details") }\n                        TextButton(onClick = { pendingDeleteId = reference.id }) { Text("Delete") }\n                    }\n                }\n            }'''
          if old not in s:
              raise SystemExit('reference History card block not found')
          main.write_text(s.replace(old, new, 1))

          test = Path('app/src/androidTest/java/com/wolferdwolf/drop/HistoryDeletionFlowTest.kt')
          t = test.read_text()
          old_test = '''        // Use the same card-anchored scroll helper that already handles this long\n        // History layout. Keeping one path avoids bypassing the verified fallback\n        // logic with a separate fixed-coordinate gesture.\n        clickText(device, "View details", scroll = true)'''
          new_test = '''        // The saved reference card itself is a deliberate navigation target. This keeps\n        // item detail reachable even when the explicit action row sits below the fold\n        // behind History's search and filter controls.\n        clickText(device, UNIQUE_TITLE)'''
          if old_test not in t:
              raise SystemExit('restored History detail navigation block not found')
          test.write_text(t.replace(old_test, new_test, 1))
          PY
      - name: Commit product and verifier fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/make-history-card-actionable.yml
          git add app/src/main/java/com/wolferdwolf/drop/MainActivity.kt app/src/androidTest/java/com/wolferdwolf/drop/HistoryDeletionFlowTest.kt
          git commit -m "Open History details from the saved item card"
          git push origin HEAD:automation/calendar-normal-flow-verification