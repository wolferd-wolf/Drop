name: Apply Open Link integration patch

on:
  push:
    branches:
      - automation/open-link-history-current-main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[open-link-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/open-link-history-current-main
      - name: Patch current main integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/wolferdwolf/drop/MainActivity.kt')
          text = main.read_text()
          text = text.replace(
              'import com.wolferdwolf.drop.maps.MapConfirmationActivity\n',
              'import com.wolferdwolf.drop.link.OpenLinkConfirmationActivity\nimport com.wolferdwolf.drop.maps.MapConfirmationActivity\n'
          )
          old = '''            SuggestedActionType.OPEN_LINK -> first(results, ExtractionType.URL)
                ?.let { launch(Intent(Intent.ACTION_VIEW, Uri.parse(normalizeUrl(it)))) } ?: fail("No link was found.")'''
          new = '''            SuggestedActionType.OPEN_LINK -> first(results, ExtractionType.URL)
                ?.let {
                    startActivity(
                        Intent(this, OpenLinkConfirmationActivity::class.java)
                            .putExtra(OpenLinkConfirmationActivity.EXTRA_URL, it)
                    )
                } ?: fail("No link was found.")'''
          if old not in text:
              raise SystemExit('Expected Open Link routing block not found')
          main.write_text(text.replace(old, new))

          ci = Path('.github/workflows/android-ci.yml')
          text = ci.read_text()
          pull = '            adb pull /data/local/tmp/drop-email-confirmation.png screenshots/drop-email-confirmation.png\n'
          test = '            test -s screenshots/drop-email-confirmation.png\n'
          if 'drop-open-link-confirmation.png' not in text:
              text = text.replace(pull, pull + '            adb pull /data/local/tmp/drop-open-link-confirmation.png screenshots/drop-open-link-confirmation.png\n')
              text = text.replace(test, test + '            test -s screenshots/drop-open-link-confirmation.png\n')
          ci.write_text(text)

          Path('.github/workflows/automation-open-link-patch.yml').unlink()
          PY
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Integrate Open Link confirmation on current main [open-link-patched]'
          git push origin HEAD:automation/open-link-history-current-main

# trigger patch workflow now
