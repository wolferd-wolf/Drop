name: Fix History selector

on:
  push:
    branches:
      - automation/calendar-normal-flow-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/calendar-normal-flow-verification
      - name: Make History selector tolerant of count suffix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/androidTest/java/com/wolferdwolf/drop/HomeScreenshotTest.kt')
          s = p.read_text()
          old = 'val history = assertVisibleAfterScroll(device, "History", "History control must remain reachable on Home")'
          new = 'val history = assertVisibleHistoryAfterScroll(device)'
          if old not in s:
              raise SystemExit('expected Home History selector not found')
          s = s.replace(old, new, 1)
          marker = '''    private fun visibleText(device: UiDevice, text: String): UiObject2? =\n        device.wait(Until.findObject(By.text(text)), SHORT_TIMEOUT_MILLIS)\n            ?.takeIf { !it.visibleBounds.isEmpty }\n'''
          helper = '''    private fun assertVisibleHistoryAfterScroll(device: UiDevice): UiObject2 {\n        fun current(): UiObject2? = device.findObjects(By.textStartsWith("History"))\n            .firstOrNull { !it.visibleBounds.isEmpty }\n\n        current()?.let { return it }\n        repeat(MAX_SCROLL_ATTEMPTS) {\n            swipeUp(device)\n            current()?.let { return it }\n        }\n        repeat(MAX_SCROLL_ATTEMPTS * 2) {\n            swipeDown(device)\n            current()?.let { return it }\n        }\n        repeat(MAX_SCROLL_ATTEMPTS * 2) {\n            swipeUp(device)\n            current()?.let { return it }\n        }\n        throw AssertionError("History control must remain reachable on Home")\n    }\n\n'''
          if marker not in s:
              raise SystemExit('helper insertion point not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
      - name: Commit selector fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/androidTest/java/com/wolferdwolf/drop/HomeScreenshotTest.kt
          git commit -m "Make Home History selector count-aware"
          git push origin HEAD:automation/calendar-normal-flow-verification
