name: Apply price extraction patch

on:
  push:
    branches: [feature/price-currency-extraction]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/price-currency-extraction
          fetch-depth: 0
      - name: Apply product changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          models = Path('app/src/main/java/com/wolferdwolf/drop/extraction/ExtractionModels.kt')
          text = models.read_text()
          if '    PRICE\n' not in text:
              text = text.replace('    TIME\n}', '    TIME,\n    PRICE\n}')
              models.write_text(text)

          extractor = Path('app/src/main/java/com/wolferdwolf/drop/extraction/RuleBasedExtractor.kt')
          text = extractor.read_text()
          marker = '        Rule(\n            ExtractionType.DATE,'
          price_rules = '''        Rule(
            ExtractionType.PRICE,
            Regex("(?i)(?<![A-Z0-9])(?:₹|Rs\\.?|INR|US\\$|\\$|€|£)\\s*(?:\\d{1,3}(?:,\\d{2,3})+|\\d+)(?:\\.\\d{1,2})?(?![\\d.,])"),
            0.97f
        ),
        Rule(
            ExtractionType.PRICE,
            Regex("(?i)(?<![\\d.,])(?:\\d{1,3}(?:,\\d{2,3})+|\\d+)(?:\\.\\d{1,2})?\\s*(?:INR|USD|EUR|GBP)(?![A-Z])"),
            0.95f
        ),
'''
          if 'ExtractionType.PRICE' not in text:
              text = text.replace(marker, price_rules + marker)
              extractor.write_text(text)

          main = Path('app/src/main/java/com/wolferdwolf/drop/MainActivity.kt')
          text = main.read_text()
          if 'ExtractionType.PRICE -> "Price or amount"' not in text:
              text = text.replace('    ExtractionType.TIME -> "Time"\n}', '    ExtractionType.TIME -> "Time"\n    ExtractionType.PRICE -> "Price or amount"\n}')
              main.write_text(text)

          tests = Path('app/src/test/java/com/wolferdwolf/drop/extraction/RuleBasedExtractorTest.kt')
          text = tests.read_text()
          if 'extractsPricesAndCurrenciesWithoutBareNumberFalsePositives' not in text:
              addition = '''
    @Test
    fun extractsPricesAndCurrenciesWithoutBareNumberFalsePositives() {
        val text = "Total ₹1,299.00, delivery Rs. 450, subscription 99.95 USD, invoice 12345."
        val prices = RuleBasedExtractor.extract(text).filter { it.type == ExtractionType.PRICE }

        assertTrue(prices.any { it.value == "₹1,299.00" })
        assertTrue(prices.any { it.value == "Rs. 450" })
        assertTrue(prices.any { it.value == "99.95 USD" })
        assertFalse(prices.any { it.value.contains("12345") })
        prices.forEach { result ->
            assertEquals(result.value, text.substring(result.sourceStart, result.sourceEndExclusive))
        }
    }

    @Test
    fun extractsCommonInternationalCurrencySymbols() {
        val results = RuleBasedExtractor.extract("Pay $25, €19.50, or £12 today")
            .filter { it.type == ExtractionType.PRICE }

        assertEquals(listOf("$25", "€19.50", "£12"), results.map { it.value })
    }
'''
              text = text.replace('\n    @Test\n    fun returnsNoResultsForBlankInput()', addition + '\n    @Test\n    fun returnsNoResultsForBlankInput()')
              tests.write_text(text)

          ui = Path('app/src/androidTest/java/com/wolferdwolf/drop/HomeScreenshotTest.kt')
          text = ui.read_text()
          if 'captureVisiblePriceExtraction' not in text:
              addition = '''
    @Test
    fun captureVisiblePriceExtraction() {
        ActivityScenario.launch(MainActivity::class.java).use {
            val device = UiDevice.getInstance(InstrumentationRegistry.getInstrumentation())
            assertVisible(device, "Paste text", "Paste text action must be visible").click()
            val input = assertObject(device, By.clazz("android.widget.EditText"), "Text entry must provide an editable field")
            input.text = "Receipt from City Market. Total ₹1,299.00. Delivery Rs. 450. Paid on 2026-08-03."
            assertVisible(device, "Continue", "Text entry must provide Continue").click()
            assertVisible(device, "Extract details", "Preview must provide extraction action").click()
            assertVisible(device, "Extracted information", "Extraction screen must be visible")
            assertVisible(device, "Price or amount", "Price extraction must have a clear visible label")
            assertVisible(device, "₹1,299.00", "Rupee amount must be visible")
            assertVisibleAfterScroll(device, "Rs. 450", "Second amount must be visible")
            capture(device, "/data/local/tmp/drop-price-extraction.png")
            assertVisibleAfterScroll(device, "See suggested actions", "Price extraction must continue to Suggested Actions").click()
            assertVisible(device, "Suggested actions", "Price content must reach Suggested Actions")
        }
    }
'''
              text = text.replace('\n    private fun capture(device: UiDevice, path: String)', addition + '\n    private fun capture(device: UiDevice, path: String)')
              ui.write_text(text)

          workflow = Path('.github/workflows/android-ci.yml')
          text = workflow.read_text()
          pull_line = '            adb pull /data/local/tmp/drop-contact-confirmation.png screenshots/drop-contact-confirmation.png\n'
          test_line = '            test -s screenshots/drop-contact-confirmation.png\n'
          if 'drop-price-extraction.png' not in text:
              if pull_line in text:
                  text = text.replace(pull_line, pull_line + '            adb pull /data/local/tmp/drop-price-extraction.png screenshots/drop-price-extraction.png\n')
                  text = text.replace(test_line, test_line + '            test -s screenshots/drop-price-extraction.png\n')
              else:
                  anchor = '            adb pull /data/local/tmp/drop-calendar-confirmation.png screenshots/drop-calendar-confirmation.png\n'
                  text = text.replace(anchor, anchor + '            adb pull /data/local/tmp/drop-price-extraction.png screenshots/drop-price-extraction.png\n')
                  text = text.replace('            test -s screenshots/drop-calendar-confirmation.png\n', '            test -s screenshots/drop-calendar-confirmation.png\n            test -s screenshots/drop-price-extraction.png\n')
              workflow.write_text(text)
          PY
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src .github/workflows/android-ci.yml
          git commit -m "Extract prices and currencies across Drop inputs"
          git push
