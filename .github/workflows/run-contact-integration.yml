name: Run contact confirmation integration

on:
  push:
    branches:
      - feature/editable-contact-confirmation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editable-contact-confirmation
      - name: Apply embedded product patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-contact-confirmation.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(source[start:end]))
          exec(compile(script, 'contact_integration.py', 'exec'))
          PY
          rm -f .github/workflows/run-contact-integration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add editable Contact confirmation flow'
          git push origin HEAD:feature/editable-contact-confirmation
