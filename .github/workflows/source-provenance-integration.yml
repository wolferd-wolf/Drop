name: Source provenance integration

on:
  push:
    branches:
      - automation/calendar-normal-flow-verification
    paths:
      - .github/drop-source-provenance-trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/calendar-normal-flow-verification
          fetch-depth: 0
      - name: Apply source provenance changes
        run: python3 tools/apply_source_provenance.py
      - name: Commit integration and remove temporary runner
        run: |
          rm -f tools/apply_source_provenance.py
          rm -f .github/workflows/source-provenance-integration.yml
          rm -f .github/drop-source-provenance-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist source provenance in History"
          git push origin HEAD:automation/calendar-normal-flow-verification
