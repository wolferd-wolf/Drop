name: Manual action data entry integration

on:
  push:
    branches:
      - automation/calendar-normal-flow-verification
    paths:
      - '.github/scripts/manual-action-data-entry-patch.py'
      - '.github/workflows/manual-action-data-entry.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/calendar-normal-flow-verification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply product patch
        run: python .github/scripts/manual-action-data-entry-patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit integrated change
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "Patch already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wolferdwolf/drop/MainActivity.kt \
                  app/src/main/java/com/wolferdwolf/drop/actions/SuggestedActionEngine.kt \
                  app/src/test/java/com/wolferdwolf/drop/actions/SuggestedActionEngineTest.kt \
                  app/src/androidTest/java/com/wolferdwolf/drop/ManualLinkCallFlowTest.kt
          git commit -m "Keep manual Open Link and Call usable without detected data"
          git push origin HEAD:automation/calendar-normal-flow-verification
