name: Apply calendar curated extraction

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/calendar-curated-extraction.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Integrate curated Calendar values
        run: |
          python3 tools/apply_calendar_curated_extraction.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Use edited extraction values in Calendar confirmation'
          git push origin HEAD:${{ github.head_ref }}
