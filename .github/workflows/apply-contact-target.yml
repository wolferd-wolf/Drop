name: Apply contact confirmation target

on:
  pull_request_target:
    branches: [main]
    paths:
      - 'verification/contact-confirmation.txt'

dpermissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply embedded product patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-contact-confirmation.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(source[start:end]))
          exec(compile(script, 'contact_integration.py', 'exec'))
          PY
          rm -f .github/workflows/run-contact-integration.yml .github/workflows/apply-contact-target.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add editable Contact confirmation flow'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
