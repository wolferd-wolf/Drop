name: Fix History return verifier

on:
  push:
    branches:
      - automation/calendar-normal-flow-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/calendar-normal-flow-verification
      - name: Keep History screenshot at top and verify return after scroll
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/androidTest/java/com/wolferdwolf/drop/HomeScreenshotTest.kt')
          s = p.read_text()
          old = '''            assertVisible(device, "Saved actions", "History screen must open from Home")\n            assertVisible(device, "Back to Home", "History screen must provide a visible return action")\n            capture(device, "/data/local/tmp/drop-history.png")'''
          new = '''            assertVisible(device, "Saved actions", "History screen must open from Home")\n            capture(device, "/data/local/tmp/drop-history.png")\n            assertVisibleAfterScroll(device, "Back to Home", "History screen must provide a reachable return action")'''
          if old not in s:
              raise SystemExit('expected History return assertion block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit verifier fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/androidTest/java/com/wolferdwolf/drop/HomeScreenshotTest.kt
          git commit -m "Make History return verification scroll-aware"
          git push origin HEAD:automation/calendar-normal-flow-verification
