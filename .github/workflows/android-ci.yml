name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK and instrumentation tests
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drop-unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drop-lint-results
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  screenshot-test:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator screenshot test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e; gradle connectedDebugAndroidTest --stacktrace; test_status=$?; mkdir -p screenshots; for name in drop-home drop-history drop-suggested-actions drop-all-actions drop-maps-suggestion drop-maps-confirmation drop-calendar-confirmation drop-calendar-curated-values drop-calendar-normal-flow drop-contact-confirmation drop-email-confirmation drop-open-link-confirmation drop-call-confirmation drop-image-review drop-pdf-review drop-paste-intake-actions drop-link-intake-actions drop-image-intake-actions drop-pdf-intake-actions drop-modern-link-actions drop-compact-price-extraction drop-multiline-address-actions drop-extraction-edit-restored drop-hyphenated-date-actions drop-year-first-date-extraction drop-year-first-date-actions drop-year-first-dotted-date-extraction drop-year-first-dotted-date-actions drop-maps-curated-value drop-history-saved-reference drop-history-reference-deleted; do adb pull "/data/local/tmp/${name}.png" "screenshots/${name}.png" || true; done; if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi; for required in drop-home drop-history drop-suggested-actions drop-all-actions drop-maps-suggestion drop-maps-confirmation drop-calendar-confirmation drop-calendar-curated-values drop-calendar-normal-flow drop-contact-confirmation drop-email-confirmation drop-open-link-confirmation drop-call-confirmation drop-image-review drop-pdf-review drop-paste-intake-actions drop-link-intake-actions drop-image-intake-actions drop-pdf-intake-actions drop-modern-link-actions drop-compact-price-extraction drop-multiline-address-actions drop-extraction-edit-restored drop-hyphenated-date-actions drop-year-first-date-extraction drop-year-first-date-actions drop-year-first-dotted-date-extraction drop-year-first-dotted-date-actions drop-maps-curated-value drop-history-saved-reference drop-history-reference-deleted; do test -s "screenshots/${required}.png" || exit 1; done

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drop-ui-screenshots
          path: screenshots/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drop-instrumentation-test-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
