name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CONTACT_INTEGRATION_START
  contact-integration:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/editable-contact-confirmation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply Contact product patch once
        shell: bash
        run: |
          if [ ! -f verification/contact-confirmation.txt ]; then exit 0; fi
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/apply-contact-confirmation.yml').read_text())
          run = workflow['jobs']['patch']['steps'][1]['run']
          script = run.split("python3 - <<'PY'\n", 1)[1].split('\nPY\n', 1)[0]
          exec(compile(script, 'contact_integration.py', 'exec'))
          ci = Path('.github/workflows/android-ci.yml')
          text = ci.read_text()
          start_marker = '  # CONTACT_INTEGRATION_START\n'
          end_marker = '  # CONTACT_INTEGRATION_END\n'
          before, rest = text.split(start_marker, 1)
          _, after = rest.split(end_marker, 1)
          ci.write_text((before + after).replace('permissions:\n  contents: write', 'permissions:\n  contents: read'))
          for path in [
              '.github/workflows/apply-contact-confirmation.yml',
              '.github/workflows/apply-contact-target.yml',
              '.github/workflows/run-contact-integration.yml',
              'verification/contact-confirmation.txt'
          ]:
              Path(path).unlink(missing_ok=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add editable Contact confirmation flow'
          git push origin HEAD:${{ github.head_ref }}
  # CONTACT_INTEGRATION_END

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK and instrumentation tests
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drop-unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drop-lint-results
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  screenshot-test:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator screenshot test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --stacktrace
            mkdir -p screenshots
            adb pull /data/local/tmp/drop-home.png screenshots/drop-home.png
            adb pull /data/local/tmp/drop-history.png screenshots/drop-history.png
            adb pull /data/local/tmp/drop-suggested-actions.png screenshots/drop-suggested-actions.png
            adb pull /data/local/tmp/drop-all-actions.png screenshots/drop-all-actions.png
            adb pull /data/local/tmp/drop-maps-suggestion.png screenshots/drop-maps-suggestion.png
            adb pull /data/local/tmp/drop-maps-confirmation.png screenshots/drop-maps-confirmation.png
            adb pull /data/local/tmp/drop-calendar-confirmation.png screenshots/drop-calendar-confirmation.png
            adb pull /data/local/tmp/drop-image-review.png screenshots/drop-image-review.png
            adb pull /data/local/tmp/drop-pdf-review.png screenshots/drop-pdf-review.png
            test -s screenshots/drop-home.png
            test -s screenshots/drop-history.png
            test -s screenshots/drop-suggested-actions.png
            test -s screenshots/drop-all-actions.png
            test -s screenshots/drop-maps-suggestion.png
            test -s screenshots/drop-maps-confirmation.png
            test -s screenshots/drop-calendar-confirmation.png
            test -s screenshots/drop-image-review.png
            test -s screenshots/drop-pdf-review.png

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drop-ui-screenshots
          path: screenshots/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drop-instrumentation-test-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
